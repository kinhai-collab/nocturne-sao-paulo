name: Stage Enkai repository path migration

on:
  push:
    branches: [chore/enkai-repository-rename]

permissions:
  contents: write

jobs:
  stage-references:
    # Only this dedicated user-owned migration branch may commit generated edits.
    if: ${{ !contains(github.event.head_commit.message, 'apply Enkai repository path migration') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update legacy repository paths in text sources and generated invites
        run: node scripts/migrate-repository-name.mjs
      - name: Reject whitespace errors
        run: git diff --check
      - name: Commit staged migration on this branch (never main)
        run: |
          git add -u
          if git diff --cached --quiet; then
            echo "Already migrated; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: apply Enkai repository path migration"
          git push origin HEAD:chore/enkai-repository-rename
