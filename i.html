<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enkai · You’re invited</title>
<meta name="description" content="Join the meal, vote on a time or restaurant, and see what the group decides.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Enkai">
<meta property="og:title" content="You’re invited to a meal · Enkai">
<meta property="og:description" content="Join the meal, vote on a time or restaurant, and see what the group decides.">
<meta property="og:image" content="https://kinhai-collab.github.io/nocturne-sao-paulo/assets/tuju-course.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:alt" content="A plated course from Tuju in São Paulo">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="planner.css">
<script src="invite.js?v=guest-rsvp1" defer></script>
<link rel="stylesheet" href="enkai-brand.css">
<link rel="stylesheet" href="invite-themes.css?v=auth1"></head>
<body>
<main><h1><span class="enkai-logo"><img src="assets/enkai-logo.jpg" alt="Enkai"></span></h1><p>You’re invited to a meal.</p><a id="open-invite" href="planner.html">Open the meal planner</a></main>
<template id="invite-preview">
  <main class="invite-frame">
    <header class="invite-header">
      <span class="invite-wordmark">Enkai</span>
      <a class="invite-signin" href="planner.html">Sign in</a>
    </header>
    <div class="invite-cover"><img alt="" width="960" height="640"></div>
    <section class="invite-content" aria-labelledby="invite-title">
      <p class="invite-kicker">An invitation from Maya</p>
      <h1 id="invite-title">Dinner with friends</h1>
      <p>Let’s get everyone around the table. Pick the times that work for you.</p>
      <dl class="invite-facts">
        <div><dt>Where</dt><dd>West End, Toronto</dd></div>
        <div><dt>Who’s coming</dt><dd>Maya, Alex and Sam</dd></div>
      </dl>
      <button type="button" class="invite-cta" id="open-vote">Vote on a time</button>
    </section>
    <footer class="invite-footer">Sample invite <span aria-hidden="true">·</span> <a id="other-theme"></a></footer>
  </main>
  <dialog class="invite-dialog" id="preview-vote" aria-labelledby="vote-title">
    <form method="dialog" class="invite-dismiss"><button aria-label="Close" value="close">×</button></form>
    <h2 id="vote-title">When can you make it?</h2>
    <form id="sample-vote">
      <fieldset>
        <legend>Select every time that works for you. Times are in Toronto.</legend>
        <label><input type="checkbox" name="time"> Friday, 7:00 p.m.</label>
        <label><input type="checkbox" name="time"> Saturday, 6:30 p.m.</label>
        <label><input type="checkbox" name="time"> Sunday, 6:00 p.m.</label>
      </fieldset>
      <button class="invite-cta" type="submit" disabled>Save sample vote</button>
    </form>
  </dialog>
</template>
</body>
</html>
